name: Verify

on:
  push:
  pull_request:
  # Weekly, and by hand from the Actions tab, every suite runs, the filter suites included.
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The screenshots job downloads the previous run's artifact to compare against.
  actions: read

jobs:
  unit:
    name: unit
    # Push covers same-repo branches. pull_request runs only for forks, so a PR is not tested twice.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # History, to see what a push changed.
          fetch-depth: 0

      # The filter suites (Camera Raw, Hue/Saturation, Levels, the filters) run only when something they cover
      # changed. The project file counts, so a version bump runs them all and every release is checked in full.
      - name: Decide whether the filter suites run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          filters=true
          if [[ "$EVENT" == push || "$EVENT" == pull_request ]] && [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]] \
             && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" HEAD > changed.txt
            pattern='^Compositor/Document/(CameraRaw|Filters|HueSaturation|ImageAdjustments|Levels|Curves|Scanlines|Dither|PixelAdjust|AdjustmentEditing|LayerAdjustment)'
            pattern+='|^Compositor/Rendering/(AdjustPixels|LevelsPixels|DitherPixels|LensPixels|NoisePixels|GPUNoise|AdjustmentSurface)'
            pattern+='|^Compositor/UI/(CameraRaw|Curves|FilterSheet|HueSaturation|Levels)'
            pattern+='|^CompositorTests/(CameraRaw|HueSaturation|ImageAdjustment|Levels|Filter|Scanlines|FinishingFilter)'
            pattern+='|^Compositor\.xcodeproj/|^\.github/workflows/verify\.yml|^scripts/ci-tests\.sh'
            grep -qE "$pattern" changed.txt || filters=false
          fi
          echo "filters=$filters" >> "$GITHUB_OUTPUT"
          echo "Filter suites: $filters"

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      # Optimized, as in a release, still testable: unoptimized, pixel loops (the app's and the tests' own) take
      # many times longer.
      - name: Build for testing
        id: build
        run: >
          xcodebuild build-for-testing
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -configuration Debug
          -derivedDataPath DerivedData
          CODE_SIGN_IDENTITY=-
          GCC_OPTIMIZATION_LEVEL=s
          SWIFT_OPTIMIZATION_LEVEL=-O

      - name: Run unit tests
        env:
          FILTERS: ${{ steps.scope.outputs.filters }}
        run: scripts/ci-tests.sh DerivedData

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          # The app's crash reports too: a test that crashes the app shows only "signal segv" in the results.
          path: |
            *.xcresult
            *.log
            ~/Library/Logs/DiagnosticReports/Compositor*.ips
          retention-days: 7
          if-no-files-found: ignore

      # The count of every batch, reconciled against the @Test declarations. Summary-only
      # otherwise: it lives in the step summary, and this artifact lets a run be checked later.
      - name: Upload test counts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-counts
          path: tools/localization/test-count-result.json
          retention-days: 30
          if-no-files-found: warn

      # The static invariants, which need no app. Each fails the job, unlike the audits that
      # only report: these are the two rules that regressions have silently broken before — the
      # text tool's letter T turning into "格式", and a literal reaching a UI sink with no entry.
      - name: Check the text tool's T icon
        run: python3 tools/localization/assert_text_tool_icon.py

      - name: Check the leak rules against their fixtures
        run: python3 tools/localization/test-leak-rules.py

      - name: Audit the catalog
        run: |
          python3 tools/localization/audit_strings.py
          python3 tools/localization/audit_keys.py

  # Release build, to catch what Debug hides: optimization-only compile errors, and a signing
  # seal that is good enough to launch but fails `codesign -v --deep --strict`. The seal check
  # is a hard failure — it is the check the app installer relies on. The artifact is for
  # inspection only: a downloaded bundle carries quarantine, and the installer still builds
  # Release locally.
  release-build:
    name: release-build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      # Same configuration as the installer's local build: Release, ad-hoc, no certificate.
      - name: Build Release
        run: >
          xcodebuild build
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -configuration Release
          -derivedDataPath DerivedData
          CODE_SIGN_IDENTITY=-
          AD_HOC_CODE_SIGNING_ALLOWED=YES
          CODE_SIGNING_REQUIRED=YES
          CODE_SIGNING_ALLOWED=YES

      - name: Check the signature seal
        run: |
          APP="$PWD/DerivedData/Build/Products/Release/Compositor.app"
          test -d "$APP" || { echo "::error::no Release app at $APP"; exit 1; }

          # The installed app must be Release: a Debug stub in MacOS/ alongside the real
          # binary is what breaks the seal when an old bundle is overwritten.
          ls "$APP/Contents/MacOS"
          for stray in Compositor.debug.dylib __preview.dylib; do
            if [ -e "$APP/Contents/MacOS/$stray" ]; then
              echo "::error::Release app contains $stray — this is a Debug build"
              exit 1
            fi
          done

          codesign -dv "$APP" 2>&1 | sed -n '1,6p'
          codesign -v --deep --strict "$APP" || {
            echo "::error::the Release app fails codesign -v --deep --strict"
            exit 1
          }
          echo "seal OK"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist"

      - name: Upload the Release app
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: compositor-release-app
          # For inspection only — never used to install.
          path: DerivedData/Build/Products/Release/Compositor.app
          retention-days: 7
          if-no-files-found: warn

  # Runs CompositorUITests/LocalizationLeakTests: launches the app under zh-Hans and fails on any
  # English label the accessibility layer exposes. Separate from `screenshots` because that job is
  # informational (continue-on-error) while this one is a gate — an English UI is a release blocker,
  # a missing screenshot is not. Separate from `unit` because UI tests need the automation permission
  # and a desktop session, which the unit job does not.
  localization-leak:
    name: localization-leak
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Allow UI automation
        run: sudo automationmodetool enable-automationmode-without-authentication

      # Its own scheme, because the Screenshots scheme pins SelectedTests to ScreenshotTests and
      # -only-testing would fight that selection.
      - name: Look for English in the Chinese UI
        run: |
          set -o pipefail
          xcodebuild test \
            -project Compositor.xcodeproj \
            -scheme LocalizationLeak \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            -resultBundlePath LocalizationLeak.xcresult \
            CODE_SIGN_IDENTITY=- \
            GCC_OPTIMIZATION_LEVEL=s \
            SWIFT_OPTIMIZATION_LEVEL=-O 2>&1 | tee leak.log
          status=${PIPESTATUS[0]}
          # The labels that leaked are in the failure message; put them in the step summary so a
          # red run says what to fix without downloading anything.
          if [ "$status" -ne 0 ]; then
            echo "## English labels in the zh-Hans interface" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'English label|^  \S+: "' leak.log | head -60 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload the leak report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: localization-leak-report
          path: |
            LocalizationLeak.xcresult
            leak.log
          retention-days: 7
          if-no-files-found: ignore

  # Screenshots of the main screens (CompositorUITests/ScreenshotTests), kept with the run to look at. Informational:
  # a screen that couldn't be reached doesn't fail the run.
  screenshots:
    name: screenshots
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # UI tests drive the app with the mouse and keyboard, which macOS otherwise asks a person to allow.
      - name: Allow UI automation
        run: sudo automationmodetool enable-automationmode-without-authentication

      - name: Take screenshots
        run: >
          xcodebuild test
          -project Compositor.xcodeproj
          -scheme Screenshots
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath DerivedData
          -resultBundlePath Screenshots.xcresult
          CODE_SIGN_IDENTITY=-
          GCC_OPTIMIZATION_LEVEL=s
          SWIFT_OPTIMIZATION_LEVEL=-O

      - name: Collect screenshots
        if: ${{ !cancelled() }}
        run: |
          xcrun xcresulttool export attachments --path Screenshots.xcresult --output-path exported
          # Named as the test named them ("01 Start.png"), not by the IDs they're exported under.
          mkdir -p screenshots
          python3 - <<'PY'
          import json, os, re, shutil
          for test in json.load(open("exported/manifest.json")):
              for item in test.get("attachments", []):
                  name = re.sub(r"_\d+_[0-9A-Fa-f-]+(\.\w+)$", r"\1", item["suggestedHumanReadableName"])
                  shutil.copy(os.path.join("exported", item["exportedFileName"]), os.path.join("screenshots", name))
          PY
          ls screenshots

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-macos-26
          path: screenshots
          retention-days: 30
          if-no-files-found: warn

      # What changed since the last run of this branch. The previous run's screenshots are looked
      # up by artifact name; a first run or an expired artifact just skips the comparison.
      - name: Find the previous screenshots
        id: previous
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest completed push run on this branch, excluding this one.
          id=$(gh api "repos/${{ github.repository }}/actions/workflows/verify.yml/runs?branch=${{ github.ref_name }}&status=success&per_page=5" \
                 --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].id // empty" 2>/dev/null || true)
          if [ -z "$id" ]; then
            echo "No previous successful run; the comparison is skipped."
            echo "dir=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p previous
          if ! gh run download "$id" -n screenshots-macos-26 -D previous; then
            echo "The previous run has no screenshots artifact; the comparison is skipped."
            echo "dir=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The artifact unzips into a subdirectory; find it rather than assuming its name.
          dir=$(find previous -type f -name '*.png' -print -quit | sed 's#/[^/]*$##')
          if [ -z "$dir" ]; then
            echo "The previous screenshots artifact holds no PNG; the comparison is skipped."
            echo "dir=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Comparing against run $id ($dir)"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Compare with the previous run
        if: ${{ !cancelled() && steps.previous.outputs.dir != '' }}
        run: |
          # Pillow makes a real pixel diff possible. When it cannot be installed (the runner's
          # Python is managed and PEP 668 refuses), the script still writes a size-based report,
          # which is why the install failure must not fail this step.
          if ! python3 -c 'import PIL' 2>/dev/null; then
            echo "Pillow is missing; trying to install it."
            pip install --quiet Pillow || pip install --quiet --user --break-system-packages Pillow \
              || echo "Pillow could not be installed; the comparison will report sizes only."
          fi
          python3 tools/compare-screenshots.py "${{ steps.previous.outputs.dir }}" screenshots screenshot-diff

      - name: Upload the comparison
        if: ${{ !cancelled() && steps.previous.outputs.dir != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diff
          path: screenshot-diff
          retention-days: 30
          if-no-files-found: ignore
